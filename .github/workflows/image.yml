name: Build and boot Civilight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civilight-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - id: discover
        run: dart run ci/flavor_matrix.dart
  image:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Build and boot ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          problem-matcher: false
      - run: dart analyze
      - name: Build minimal image and capture console login
        if: matrix.src == ''
        run: dart run ci/build_and_capture.dart
      - name: Build flavor image and capture its login screen
        if: matrix.src != ''
        env:
          FLAVOR: ${{ matrix.src }}
        run: dart run ci/build_and_capture.dart --src "$FLAVOR"
      - name: Upload verified screenshot
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-screenshot
          path: out/ci/${{ matrix.name }}/${{ (matrix.login == 'gdm' || matrix.login == 'sddm') && 'gui.png' || 'login.png' }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload QEMU diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-qemu-logs
          path: |
            out/ci/${{ matrix.name }}/serial.log
            out/ci/${{ matrix.name }}/last-screen.png
          if-no-files-found: ignore
          retention-days: 14
