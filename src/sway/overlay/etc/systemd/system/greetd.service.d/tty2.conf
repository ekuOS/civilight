[Unit]
# The packaged unit claims tty1; keep it free for the boot console.
Conflicts=
After=getty@tty2.service kmsconvt@tty2.service
Conflicts=getty@tty2.service kmsconvt@tty2.service

[Service]
# greetd locks its address space, which would fault in mimalloc's 1 GiB
# arena reservation. A small arena is ample for a login daemon.
Environment=MIMALLOC_ARENA_RESERVE=65536
